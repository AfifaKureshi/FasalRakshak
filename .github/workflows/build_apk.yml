name: Build & Release FasalRakshak APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FasalRakshak-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: FasalRakshak v1.0.0 (Release Build #${{ github.run_number }})
          body: |
            ## FasalRakshak: AI-Powered Crop Health & Risk Intelligence Platform
            **Tagline:** "From Crop Detection to Early Action"

            ### 📱 Download Android APK
            Download and install `app-release.apk` below directly onto your Android device.

            ### ✨ Key Features
            - **Multilingual Support**: English, हिन्दी (Hindi), ગુજરાતી (Gujarati), मराठी (Marathi)
            - **Real Camera & Gallery Leaf Diagnosis**: Real-time foliar analysis and confidence check
            - **Explainable Multi-Factor Risk Engine**: Weather, humidity, soil moisture & pest density
            - **Continuous 7-Day Monitoring**: Day 0 vs Day 7 regression tracking
            - **Pre-Seeded 1-Click Demo Accounts**: Farmer, Expert, and Officer personas
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
